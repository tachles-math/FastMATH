
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מת טיק טק | Maths TikTak</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#17243b;font-family:Arial,sans-serif}
header{background:#101e36;color:white;padding:22px;text-align:center}
.logo{font-size:30px;font-weight:900}
.logo span{color:#64e5c1}
.hero{background:linear-gradient(120deg,#142b4b,#214c69);color:white;text-align:center;padding:35px 15px}
.hero h1{font-size:30px}
.hero p{line-height:1.7}
main{max-width:1100px;margin:auto;padding:24px 15px}
.search{width:100%;padding:15px;border:1px solid #d5deea;border-radius:12px;font-size:16px;margin:15px 0 25px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:white;border:1px solid #e5eaf2;border-radius:17px;overflow:hidden;box-shadow:0 5px 20px #12223a10}
.folder-icon{background:linear-gradient(135deg,#193657,#317e92);height:155px;display:grid;place-items:center;font-size:65px}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.content{padding:18px}
.content h3{margin:0 0 12px;line-height:1.5}
.content p{color:#65748a}
button{background:#16b89a;color:#062d29;border:0;border-radius:11px;padding:12px 18px;font-weight:bold;font-size:16px;cursor:pointer}
.card button{width:100%}
.back{margin:10px 0 22px;background:#e1eaf5;color:#17243b}
[hidden]{display:none!important}
dialog{border:0;border-radius:18px;width:95%;max-width:850px;padding:18px}
dialog::backdrop{background:#071527cc}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
footer{text-align:center;padding:35px;color:#66748a}
</style>
</head>
<body>
<header>
<div class="logo">מת <span>טיק טק</span></div>
<div>Maths TikTak</div>
</header>
<section class="hero">
<h1>נתקעת בתרגיל? פותרים בטיק טק!</h1>
<p>פתרונות קצרים, ברורים ומסודרים לפי מבחנים ונושאים.</p>
</section>
<main>
<h2>ספריית הפתרונות</h2>
<input class="search" id="search" placeholder="חיפוש מבחן, שאלה או נושא...">
<div id="folders" class="grid"></div>
<section id="inside" hidden>
<button class="back" onclick="back()">← חזרה לתיקיות</button>
<h2 id="folderTitle"></h2>
<div id="videos" class="grid"></div>
</section>
</main>
<dialog id="player">
<button class="back" onclick="closePlayer()">סגירה ✕</button>
<h2 id="playerTitle"></h2>
<iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<p><a id="youtubeLink" target="_blank" rel="noopener">צפייה ביוטיוב</a></p>
</dialog>
<footer>מת טיק טק · Maths TikTak</footer>
<script>
let library=[];
let current=null;
const $=id=>document.getElementById(id);
function safe(s){
return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getId(v){
let id=String(v.id||'');
if(/^[\w-]{11}$/.test(id))return id;
try{
let u=new URL(v.url);
id=u.hostname.includes('youtu.be')?u.pathname.slice(1):u.searchParams.get('v');
return /^[\w-]{11}$/.test(id)?id:'';
}catch{return ''}
}
function groups(){
return [...new Set(library.map(v=>v.topic||'כללי'))];
}
function render(){
let q=$('search').value.trim().toLowerCase();
$('folders').hidden=!!current;
$('inside').hidden=!current;
if(!current){
$('folders').innerHTML='';
groups().filter(g=>g.toLowerCase().includes(q)||library.some(v=>(v.topic||'כללי')===g&&v.title.toLowerCase().includes(q))).forEach(g=>{
let n=library.filter(v=>(v.topic||'כללי')===g).length;
let card=document.createElement('article');
card.className='card';
card.innerHTML='<div class="folder-icon">📁</div><div class="content"><h3>'+safe(g)+'</h3><p>'+n+' סרטונים</p><button>פתיחת תיקייה</button></div>';
card.querySelector('button').onclick=()=>openFolder(g);
$('folders').append(card);
});
}else{
$('folderTitle').textContent=current;
$('videos').innerHTML='';
library.filter(v=>(v.topic||'כללי')===current&&v.title.toLowerCase().includes(q)).forEach(v=>{
let id=getId(v);
if(!id)return;
let card=document.createElement('article');
card.className='card';
card.innerHTML='<img loading="lazy" alt="תמונת הסרטון" src="https://i.ytimg.com/vi/'+id+'/hqdefault.jpg"><div class="content"><h3>'+safe(v.title)+'</h3><p>'+safe(v.description||'פתרון קצר וממוקד')+'</p><button>▶ צפייה בפתרון</button></div>';
card.querySelector('button').onclick=()=>play(v);
$('videos').append(card);
});
}
}
function openFolder(name){current=name;$('search').value='';render()}
function back(){current=null;$('search').value='';render()}
function play(v){
let id=getId(v);
$('playerTitle').textContent=v.title;
$('frame').src='https://www.youtube-nocookie.com/embed/'+id;
$('youtubeLink').href='https://www.youtube.com/watch?v='+id;
$('player').showModal();
}
function closePlayer(){
$('frame').src='about:blank';
$('player').close();
}
$('player').addEventListener('close',()=>{$('frame').src='about:blank'});
$('search').addEventListener('input',render);
fetch('./videos.json',{cache:'no-store'})
.then(r=>{if(!r.ok)throw Error();return r.json()})
.then(data=>{library=Array.isArray(data)?data:[];render()})
.catch(()=>{$('folders').textContent='לא ניתן לטעון את הסרטונים. נסה לרענן את הדף.'});
</script>
</body>
</html>
